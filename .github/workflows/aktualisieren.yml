# Holt jeden Montag den aktuellen Stand von www.repairinfo.app und committet nur bei Änderungen.
# Weekly refresh from www.repairinfo.app; commits only when files changed. Keine Geheimnisse nötig.
name: Daten aktualisieren
on:
  schedule:
    - cron: "15 4 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  aktualisieren:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/aktualisieren.sh
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Keine Änderungen"; exit 0; fi
          git commit -m "Daten aktualisiert $(date -u +%Y-%m-%d)"
          git push
